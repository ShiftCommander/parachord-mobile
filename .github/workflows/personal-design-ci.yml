name: Personal Design CI (Android debug)

on:
  pull_request:
    branches: [main]
  push:
    branches: [design/shadcn-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-design-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-build-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: parachord-personal-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
